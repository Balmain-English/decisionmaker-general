<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Great USA Holiday Maze - A2 English Game</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --warning: #ea580c;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .score-badge {
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      border-radius: 20px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .screen {
      display: none;
      text-align: center;
    }

    .screen.active {
      display: block;
    }

    .scenario-box {
      margin-bottom: 24px;
    }

    .step-tag {
      display: block;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #64748b;
    }

    .step-tag.emergency-tag {
      color: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .scenario-text {
      font-size: 1.15rem;
      line-height: 1.5;
      font-weight: 600;
      color: #0f172a;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 14px 18px;
      text-align: left;
      font-size: 1rem;
      line-height: 1.4;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: #e2e8f0;
      border-color: #94a3b8;
      transform: translateY(-2px);
    }

    .option-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .modal-card.blue { border-top: 6px solid var(--primary); }
    .modal-card.green { border-top: 6px solid var(--success); }
    .modal-card.orange { border-top: 6px solid var(--warning); }
    .modal-card.red { border-top: 6px solid var(--danger); }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .modal-text {
      font-size: 1rem;
      line-height: 1.5;
      color: #334155;
      margin-bottom: 20px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .action-btn:hover {
      background: #1d4ed8;
    }

    .screen h2 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .screen p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 20px;
    }

    .rank-badge {
      display: inline-block;
      padding: 8px 18px;
      background: #fef3c7;
      color: #b45309;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 16px;
    }

    .icon { font-size: 1.4rem; }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="title">
        <span class="icon">✈️</span>
        <span>The Great USA Holiday Maze</span>
      </div>
      <div class="score-badge" id="scoreDisplay">Score: 0 pts</div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="gameScreen" class="screen active">
      <div class="scenario-box">
        <span class="step-tag" id="stepTag">Scenario 1 of 14</span>
        <div class="scenario-text" id="scenarioText">Loading scenario...</div>
      </div>
      <div class="options-grid" id="optionsContainer"></div>
    </div>

    <div id="gameOverScreen" class="screen">
      <h2 style="color: var(--danger);">GAME OVER!</h2>
      <p id="gameOverReason">You made a dangerous choice during an emergency situation!</p>
      <button class="action-btn" onclick="restartGame()">Try Again</button>
    </div>

    <div id="debriefScreen" class="screen">
      <h2 style="color: var(--success);">Holiday Completed!</h2>
      <div class="rank-badge" id="rankBadge">Rank: Loading...</div>
      <p id="debriefFeedback">Loading your final debriefing...</p>
      <button class="action-btn" onclick="restartGame()">Play Again</button>
    </div>

    <div class="modal-overlay" id="feedbackModal">
      <div class="modal-card" id="modalCard">
        <div class="modal-title" id="modalTitle">Feedback</div>
        <div class="modal-text" id="modalText">Feedback message goes here.</div>
        <button class="action-btn" id="modalBtn" onclick="closeModal()">Continue</button>
      </div>
    </div>
  </div>

  <script>
    const gameData = [
      {
        type: 'standard',
        title: 'Scenario 1: Travel Season',
        text: 'When do you plan to travel across the USA for your holiday?',
        choices: [
          { text: 'May - June', scoreType: 'excellent', points: 3, feedback: 'Excellent choice! Warm sunshine, mild temperatures, and reasonable prices make late spring perfect for sightseeing.' },
          { text: 'July - August', scoreType: 'good', points: 2, feedback: 'Good choice! Summer is popular, though national parks and beaches become crowded.' },
          { text: 'September', scoreType: 'acceptable', points: 1, feedback: 'Acceptable choice! Autumn leaves can be beautiful, but weather can change quickly in some regions.' },
          { text: 'December', scoreType: 'poor', points: -1, feedback: 'Oh no! Heavy snowstorms can freeze highways and cancel flights in many states.' }
        ]
      },
      {
        type: 'standard',
        title: 'Scenario 2: Plane Tickets',
        text: 'When will you buy your flight tickets to America?',
        choices: [
          { text: '6 months before travel', scoreType: 'excellent', points: 3, feedback: 'Top choice! Booking early gives the best prices and seats.' },
          { text: '2 months before travel', scoreType: 'good', points: 2, feedback: 'Good timing! You get decent prices without leaving it too late.' },
          { text: '2 weeks before travel', scoreType: 'acceptable', points: 1, feedback: 'Acceptable, but risky! Prices rise sharply close to departure.' },
          { text: 'At the airport on the day', scoreType: 'poor', points: -1, feedback: 'Yikes! Flights are usually full or extremely expensive at the airport.' }
        ]
      },
      {
        type: 'destination',
        title: 'Scenario 3: Starting Point',
        text: 'Where will you start your grand US adventure?',
        choices: [
          { text: 'New York City', scoreType: 'neutral', feedback: 'Awesome choice! The Big Apple is full of energy, parks, and world-famous landmarks.' },
          { text: 'Los Angeles', scoreType: 'neutral', feedback: 'Fantastic! You can enjoy Hollywood, beaches, and great food.' },
          { text: 'Miami', scoreType: 'neutral', feedback: 'Great pick! Warm ocean water and nightlife make it memorable.' },
          { text: 'Chicago', scoreType: 'neutral', feedback: 'Cool destination! It is known for skyscrapers, museums, and pizza.' }
        ]
      },
      {
        type: 'standard',
        title: 'Scenario 4: Getting Around',
        text: 'How will you travel between cities inside the United States?',
        choices: [
          { text: 'Rent a car', scoreType: 'excellent', points: 3, feedback: 'Perfect decision! A car gives freedom to explore highways and scenery.' },
          { text: 'Domestic flights', scoreType: 'good', points: 2, feedback: 'Good choice! Fast for long distances, though airport time can be long.' },
          { text: 'Train (Amtrak)', scoreType: 'acceptable', points: 1, feedback: 'Acceptable option! Train travel is comfortable, but US trains are limited in some areas.' },
          { text: 'Hitchhiking', scoreType: 'poor', points: -1, feedback: 'Dangerous move! Hitchhiking on major US highways is unsafe and often illegal.' }
        ]
      },
      {
        type: 'standard',
        title: 'Scenario 5: Lodging',
        text: 'Where do you plan to sleep during your travel nights?',
        choices: [
          { text: 'Airbnb apartments', scoreType: 'excellent', points: 3, feedback: 'Excellent pick! Kitchen access and local neighborhoods make travel more authentic.' },
          { text: '4-star hotels', scoreType: 'good', points: 2, feedback: 'Very comfortable choice! Enjoy service and comfort, though costs can rise quickly.' },
          { text: 'Budget roadside motels', scoreType: 'acceptable', points: 1, feedback: 'Acceptable choice! Budget motels save money, though quality can vary.' },
          { text: 'No booking in advance', scoreType: 'poor', points: -1, feedback: 'Oh dear! Popular tourist cities can sell out, leaving you without a place to sleep.' }
        ]
      },
      {
        type: 'standard',
        title: 'Scenario 6: Daily Budget',
        text: 'How much daily spending budget per person will you set?',
        choices: [
          { text: '$150 per day', scoreType: 'excellent', points: 3, feedback: 'Smart financial planning! This covers food, transport, and activity costs well.' },
          { text: '$100 per day', scoreType: 'good', points: 2, feedback: 'Good budget! Manageable if you mix affordable meals and attractions.' },
          { text: '$50 per day', scoreType: 'acceptable', points: 1, feedback: 'Tight budget! You will need careful choices and simple food options.' },
          { text: 'No budget at all', scoreType: 'poor', points: -1, feedback: 'Danger! Uncontrolled spending drains money fast and can ruin the trip.' }
        ]
      },
      {
        type: 'emergency',
        title: 'EMERGENCY SITUATION 1!',
        text: 'While driving on a remote desert highway in Utah, your rental car tire suddenly pops!',
        choices: [
          { text: 'Pull safely onto the emergency shoulder, turn on hazard lights, and call roadside assistance.', scoreType: 'excellent', points: 2, feedback: 'Smart, safe action! That keeps you away from traffic and helps you get help quickly.' },
          { text: 'Step out into fast highway traffic and wave down trucks with your hands.', scoreType: 'gameover', points: 0, feedback: 'Standing near highway traffic is extremely dangerous and could cause serious injury.' }
        ]
      },
      {
        type: 'standard',
        title: 'Scenario 7: Main Activities',
        text: 'What will be the primary activity focus of your vacation?',
        choices: [
          { text: 'National Parks', scoreType: 'excellent', points: 3, feedback: 'Breathtaking choice! The US has amazing parks with stunning views and landscapes.' },
          { text: 'Theme Parks', scoreType: 'good', points: 2, feedback: 'Super fun choice! Rollercoasters and attractions make a memorable holiday.' },
          { text: 'Big Cities', scoreType: 'acceptable', points: 1, feedback: 'Enjoyable option! Museums, shows, and famous landmarks are wonderful.' },
          { text: 'Only outlet shopping', scoreType: 'poor', points: -1, feedback: 'What a waste! Shopping alone misses out on the best of American nature and cities.' }
        ]
      },
      {
        type: 'standard',
        title: 'Scenario 8: Travel Insurance',
        text: 'Which travel insurance policy will you purchase before leaving?',
        choices: [
          { text: 'Full comprehensive insurance', scoreType: 'excellent', points: 3, feedback: 'Wise decision! It covers medical emergencies, cancellations, and lost bags.' },
          { text: 'Basic travel insurance', scoreType: 'good', points: 2, feedback: 'Good protection! It covers serious issues without being too expensive.' },
          { text: 'Medical protection only', scoreType: 'acceptable', points: 1, feedback: 'Acceptable safety net! It helps with health issues but not everything.' },
          { text: 'No insurance at all', scoreType: 'poor', points: -1, feedback: 'Extreme risk! Emergency medical care in America can be very expensive.' }
        ]
      },
      {
        type: 'standard',
        title: 'Scenario 9: Pace of Travel',
        text: 'How long do you plan to stay in each destination stop?',
        choices: [
          { text: '1 week per region', scoreType: 'excellent', points: 3, feedback: 'Wonderful relaxed pace! You can enjoy the place without feeling exhausted.' },
          { text: '3 to 4 days per region', scoreType: 'good', points: 2, feedback: 'Balanced schedule! Enough time to explore without rushing too much.' },
          { text: '1 to 2 days per region', scoreType: 'acceptable', points: 1, feedback: 'Very rushed! You will spend more time traveling than enjoying sights.' },
          { text: 'No schedule plan', scoreType: 'poor', points: -1, feedback: 'Total chaos! Without a plan, you can waste time and miss good bookings.' }
        ]
      },
      {
        type: 'standard',
        title: 'Scenario 10: Payment Methods',
        text: 'How will you pay for goods and services across the US?',
        choices: [
          { text: 'Credit card + backup card', scoreType: 'excellent', points: 3, feedback: 'Ideal combination! The US is mostly cashless, and a backup card helps when needed.' },
          { text: 'One credit card only', scoreType: 'good', points: 2, feedback: 'Convenient method! Most places accept cards, but it is smart to keep a backup.' },
          { text: 'Cash only', scoreType: 'acceptable', points: 1, feedback: 'Inconvenient choice! Many hotels, rental desks, and stadiums prefer cards.' },
          { text: 'Let your friend pay all', scoreType: 'poor', points: -1, feedback: 'Unfair strategy! Relying on someone else can create stress and awkwardness.' }
        ]
      },
      {
        type: 'standard',
        title: 'Scenario 11: Packing Bags',
        text: 'What packing strategy will you choose for your trip?',
        choices: [
          { text: 'One medium suitcase each', scoreType: 'excellent', points: 3, feedback: 'Practical decision! It fits in cars and works well for flights.' },
          { text: 'Light backpack only', scoreType: 'good', points: 2, feedback: 'Super agile travel! Good for quick movement, though laundry becomes important.' },
          { text: 'Buy all clothes in the US', scoreType: 'acceptable', points: 1, feedback: 'Fun idea, but it wastes precious time after arriving.' },
          { text: 'Two giant heavy suitcases each', scoreType: 'poor', points: -1, feedback: 'Heavy burden! Oversized luggage is inconvenient and costly to manage.' }
        ]
      },
      {
        type: 'standard',
        title: 'Scenario 12: Cancelled Flight',
        text: 'Oh no! The airline cancels your connecting flight due to bad weather. What do you do?',
        choices: [
          { text: 'Contact the airline service desk immediately', scoreType: 'excellent', points: 3, feedback: 'Responsible action! Agents can rebook you onto the next available flight.' },
          { text: 'Buy expensive new tickets online yourself', scoreType: 'good', points: 2, feedback: 'Fast solution, but costly! Airlines usually rebook passengers for free during delays.' },
          { text: 'Wait silently near the gate', scoreType: 'acceptable', points: 1, feedback: 'Passive response! Others may take the remaining seats if you wait too long.' },
          { text: 'Cancel the whole vacation and go home', scoreType: 'poor', points: -1, feedback: 'Major overreaction! Travel delays happen often; stay calm and ask for help.' }
        ]
      },
      {
        type: 'emergency',
        title: 'EMERGENCY SITUATION 2!',
        text: 'A sudden severe weather tornado siren sounds while you are inside a highway gas station!',
        choices: [
          { text: 'Follow gas station staff quickly into an interior basement room away from glass windows.', scoreType: 'excellent', points: 2, feedback: 'Excellent survival choice! Staying away from windows reduces risk from flying debris.' },
          { text: 'Climb up a tall metal light pole outside to film a dramatic video for social media.', scoreType: 'gameover', points: 0, feedback: 'That is extremely dangerous. Severe storm winds and flying debris can cause serious injury.' }
        ]
      }
    ];

    let currentStep = 0;
    let score = 0;
    let isWaitingForNext = false;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initGame() {
      currentStep = 0;
      score = 0;
      updateScoreDisplay();
      showScreen('gameScreen');
      loadScenario();
    }

    function updateScoreDisplay() {
      document.getElementById('scoreDisplay').textContent = `Score: ${score} pts`;
    }

    function loadScenario() {
      isWaitingForNext = false;
      const scenario = gameData[currentStep];
      const progress = (currentStep / gameData.length) * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;

      const stepTag = document.getElementById('stepTag');
      if (scenario.type === 'emergency') {
        stepTag.className = 'step-tag emergency-tag';
        stepTag.textContent = scenario.title;
      } else {
        stepTag.className = 'step-tag';
        stepTag.textContent = `Step ${currentStep + 1} of ${gameData.length}: ${scenario.title}`;
      }

      document.getElementById('scenarioText').textContent = scenario.text;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      let optionsToDisplay = scenario.choices.map((choice, index) => ({ ...choice, originalIndex: index }));
      if (scenario.type !== 'emergency') {
        optionsToDisplay = shuffleArray(optionsToDisplay);
      }

      optionsToDisplay.forEach((choice) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = choice.text;
        btn.addEventListener('click', () => handleChoice(choice, btn));
        container.appendChild(btn);
      });
    }

    function handleChoice(choice, buttonElement) {
      if (choice.scoreType === 'gameover') {
        document.getElementById('gameOverReason').textContent = choice.feedback;
        showScreen('gameOverScreen');
        return;
      }

      if (choice.scoreType === 'poor') {
        score = Math.max(0, score + choice.points);
        updateScoreDisplay();
        buttonElement.disabled = true;
        showModal('red', 'Try Again!', choice.feedback, 'Choose Again');
        return;
      }

      if (choice.points) {
        score += choice.points;
        updateScoreDisplay();
      }

      isWaitingForNext = true;

      let modalColor = 'blue';
      let modalTitleText = 'Excellent Choice!';

      if (choice.scoreType === 'good') {
        modalColor = 'green';
        modalTitleText = 'Good Choice!';
      } else if (choice.scoreType === 'acceptable') {
        modalColor = 'orange';
        modalTitleText = 'Acceptable Choice!';
      } else if (choice.scoreType === 'neutral') {
        modalColor = 'blue';
        modalTitleText = 'Destination Selected!';
      }

      showModal(modalColor, modalTitleText, choice.feedback, 'Continue');
    }

    function showModal(color, title, text, btnText) {
      const card = document.getElementById('modalCard');
      card.className = `modal-card ${color}`;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalText').textContent = text;
      document.getElementById('modalBtn').textContent = btnText;
      document.getElementById('feedbackModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('feedbackModal').classList.remove('active');

      if (isWaitingForNext) {
        currentStep += 1;
        if (currentStep >= gameData.length) {
          showDebriefing();
        } else {
          loadScenario();
        }
      }
    }

    function showDebriefing() {
      document.getElementById('progressBar').style.width = '100%';
      showScreen('debriefScreen');

      const rankBadge = document.getElementById('rankBadge');
      const debriefFeedback = document.getElementById('debriefFeedback');

      if (score >= 30) {
        rankBadge.textContent = `Gold Rank: Ultimate USA Road Tripper (${score} pts)`;
        debriefFeedback.textContent = 'Incredible job! You planned a flawless American holiday with top-tier choices. From smart budgeting and proper insurance to relaxed pacing, you handled every challenge with excellent judgment.';
      } else if (score >= 20) {
        rankBadge.textContent = `Silver Rank: Smart USA Explorer (${score} pts)`;
        debriefFeedback.textContent = 'Great work! You made very solid decisions throughout your journey across America. A few minor choices were a bit rushed or pricey, but overall you navigated the trip well.';
      } else if (score >= 10) {
        rankBadge.textContent = `Bronze Rank: Rookie Traveler (${score} pts)`;
        debriefFeedback.textContent = 'Nice effort! You completed the trip, though some choices created extra stress or unexpected costs. With better planning, your next adventure will be even smoother.';
      } else {
        rankBadge.textContent = `Starter Rank: Lost Tourist (${score} pts)`;
        debriefFeedback.textContent = 'Oops! Your trip encountered several unexpected problems, high costs, and schedule chaos. Do not worry; learning from mistakes is part of the fun.';
      }
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach((screen) => screen.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function restartGame() {
      initGame();
    }

    window.addEventListener('load', initGame);
  </script>
</body>
</html>
