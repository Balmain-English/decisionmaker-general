<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18314b">
  <meta name="description" content="Decision-making activities and interactive scenarios in the Balmain English Learning Library.">
  <title>Decisionmaker Exercises | Balmain English Learning Library</title>
  <style>
    :root{color-scheme:light;--ink:#18314b;--teal:#2f6f6d;--teal-dark:#245856;--paper:#f4f2ec;--surface:#fff;--muted:#607080;--line:#d8dedf;--shadow:0 6px 16px rgba(24,49,75,.06)}
    *{box-sizing:border-box}
    html{min-height:100%;scroll-behavior:smooth}
    body{min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font:13px/1.45 Inter,"Segoe UI",Arial,sans-serif}
    .shell{width:min(1440px,calc(100% - 40px));margin-inline:auto}
    .masthead{background:var(--ink);color:#fff;border-bottom:3px solid var(--teal)}
    .masthead-inner{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{display:flex;align-items:center;gap:9px;font-size:.92rem;font-weight:700;letter-spacing:.01em}
    .brand-mark{display:grid;place-items:center;width:27px;height:27px;border:1px solid rgba(255,255,255,.35);border-radius:6px;color:#d9e8e5;font: .9rem Georgia,serif}
    .library-label{color:#d9e2e8;font-size:.74rem}
    main{padding:24px 0 38px}
    .intro{padding-bottom:16px;border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 4px;color:var(--teal);font-size:.64rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
    h1{margin:0;color:var(--ink);font:600 clamp(1.45rem,2.4vw,1.9rem)/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.02em}
    .lede{max-width:720px;margin:6px 0 0;color:var(--muted);font-size:.82rem}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0 10px}
    .section-title{margin:0;font-size:.86rem;font-weight:700}
    .count{margin-left:6px;color:var(--muted);font-size:.72rem;font-weight:500}
    .search{width:min(310px,100%);min-height:34px;padding:6px 10px;border:1px solid #bdc9cc;border-radius:6px;background:#fff;color:var(--ink);font:inherit}
    .search::placeholder{color:#72808b}
    .search:focus{outline:3px solid rgba(47,111,109,.2);border-color:var(--teal)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;padding:0;margin:0;list-style:none}
    .grid li{min-width:0}
    .card{display:flex;min-height:74px;height:100%;flex-direction:column;justify-content:space-between;gap:7px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);text-decoration:none;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}
    .card:hover{transform:translateY(-1px);border-color:#8eaaa8;background:#fbfdfc;box-shadow:0 7px 14px rgba(24,49,75,.09)}
    .card:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
    .card-title{font-size:.78rem;font-weight:650;line-height:1.28;overflow-wrap:anywhere}
    .card-meta{display:flex;align-items:center;justify-content:space-between;gap:5px;padding-top:5px;border-top:1px solid #edf0ef;color:var(--muted);font-size:.61rem}
    .level{flex:none;padding:1px 5px;border-radius:999px;background:#e8f1ef;color:var(--teal-dark);font-size:.59rem;font-weight:700}
    .open{color:var(--teal-dark);font-weight:700;white-space:nowrap}
    .message{grid-column:1/-1;padding:18px;border:1px dashed #b9c5c6;border-radius:7px;background:rgba(255,255,255,.55);color:var(--muted);text-align:center}
    footer{padding:13px 0 18px;border-top:1px solid var(--line);color:var(--muted);font-size:.68rem;text-align:center}
    @media(max-width:700px){.shell{width:calc(100% - 28px)}main{padding-top:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}}
    @media(max-width:420px){.grid{grid-template-columns:1fr}.masthead-inner{min-height:54px}.library-label{font-size:.68rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="masthead"><div class="shell masthead-inner"><div class="brand"><span class="brand-mark" aria-hidden="true">B</span><span>Balmain English</span></div><div class="library-label">Learning Library</div></div></header>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title"><p class="eyebrow">English learning resources</p><h1 id="page-title">Decisionmaker exercises</h1><p class="lede">Interactive scenarios to practise weighing options, making decisions and communicating effectively in English.</p></section>
    <section aria-label="Exercise directory"><div class="toolbar"><h2 class="section-title">Explore the collection <span class="count" id="count" aria-live="polite">Loading…</span></h2><input class="search" id="search" type="search" placeholder="Search exercises…" aria-label="Search exercises" autocomplete="off"></div><ul class="grid" id="items" aria-live="polite" aria-busy="true"><li class="message">Loading exercises…</li></ul></section>
  </main>
  <footer><div class="shell">Balmain English · Learning Library</div></footer>
  <script>
    (()=>{
      const owner='Balmain-English',repo='decisionmaker-general';
      const list=document.getElementById('items'),search=document.getElementById('search'),count=document.getElementById('count');
      let pages=[];
      const titleOf=path=>path.split('/').pop().replace(/\.html?$/i,'').replace(/-(\d+)(?:[a-z])?$/i,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase());
      const levelOf=path=>{const match=path.match(/-(\d+)(?:[a-z])?\.html?$/i);return match?`Level ${match[1]}`:''};
      function render(){
        const query=search.value.trim().toLowerCase();
        const visible=pages.filter(page=>page.title.toLowerCase().includes(query)||page.path.toLowerCase().includes(query));
        count.textContent=`${visible.length} ${visible.length===1?'exercise':'exercises'}`;
        list.replaceChildren();
        if(!visible.length){const item=document.createElement('li');item.className='message';item.textContent=pages.length?'No exercises match your search.':'No exercises are available yet.';list.append(item);return}
        const fragment=document.createDocumentFragment();
        visible.forEach(page=>{
          const item=document.createElement('li'),link=document.createElement('a');
          link.className='card';link.href='./'+page.path.split('/').map(encodeURIComponent).join('/');
          const title=document.createElement('span');title.className='card-title';title.textContent=page.title;
          const meta=document.createElement('span');meta.className='card-meta';
          const kind=document.createElement('span');kind.textContent='Interactive scenario';meta.append(kind);
          if(page.level){const level=document.createElement('span');level.className='level';level.textContent=page.level;meta.append(level)}
          const open=document.createElement('span');open.className='open';open.textContent='Open ↗';meta.append(open);
          link.append(title,meta);item.append(link);fragment.append(item);
        });
        list.append(fragment);
      }
      fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`)
        .then(response=>{if(!response.ok)throw new Error('Unable to load exercises');return response.json()})
        .then(data=>{
          pages=(data.tree||[]).filter(file=>file.type==='blob'&&/\.html?$/i.test(file.path)&&!/index\.html$/i.test(file.path.split('/').pop())).map(file=>({path:file.path,title:titleOf(file.path),level:levelOf(file.path)})).sort((a,b)=>a.title.localeCompare(b.title));
          list.setAttribute('aria-busy','false');render();
        })
        .catch(()=>{count.textContent='Exercises unavailable';list.setAttribute('aria-busy','false');list.innerHTML='<li class="message">Unable to load exercises right now. Please try again later.</li>'});
      search.addEventListener('input',render);
    })();
  </script>
</body>
</html>
