<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decisionmaker Exercises — Directory</title>
  <meta name="description" content="Public directory of all HTML exercise pages in the decisionmaker-general repository." />
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0e2a47 50%, #1e3a8a 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-hover-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f0f9ff;
      --text-muted: #93c5fd;
      --accent-blue: #38bdf8;
      --accent-hover: #7dd3fc;
      --badge-level-1: #38bdf8;
      --badge-level-2: #818cf8;
      --badge-level-3: #c084fc;
      --badge-default: #94a3b8;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--text-main);
      background: var(--bg-gradient);
      background-attachment: fixed;
      line-height: 1.5;
    }

    .site {
      max-width: 1280px;
      margin: 40px auto;
      padding: 32px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 24px;
    }

    @media (min-width: 768px) {
      header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .title h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .title .muted {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 300px;
    }

    .search {
      width: 100%;
      padding: 12px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-main);
      outline: none;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .search:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .search::placeholder {
      color: rgba(147,197,253,0.5);
    }

    .filter-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: var(--accent-blue);
    }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 16px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    @media (min-width: 540px) { .link-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 820px) { .link-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1100px) { .link-grid { grid-template-columns: repeat(4, 1fr); } }

    .link-grid li { margin: 0; }

    .exercise-btn {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      min-height: 84px;
      text-decoration: none;
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .exercise-btn:hover {
      background: var(--card-hover-bg);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .exercise-btn:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    .btn-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .exercise-btn .title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      line-height: 1.3;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #0f172a;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .tag-1 { background: var(--badge-level-1); }
    .tag-2 { background: var(--badge-level-2); }
    .tag-3 { background: var(--badge-level-3); }
    .tag-none { background: var(--badge-default); }

    .btn-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 12px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent-blue);
      gap: 4px;
    }

    .exercise-btn:hover .btn-footer { color: var(--accent-hover); }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    #count {
      font-weight: 700;
      color: var(--accent-blue);
    }

    .skip {
      position: absolute;
      left: -9999px;
    }
    .skip:focus {
      left: 10px;
      top: 10px;
      background: var(--accent-blue);
      color: #000;
      padding: 8px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <div class="site">
    <header>
      <div class="title">
        <h1>Decisionmaker Exercises</h1>
        <div class="muted">Interactive scenarios for language learners</div>
      </div>

      <div class="controls" role="search">
        <input id="filter" class="search" type="search" placeholder="Search exercises (press '/' to focus)" aria-label="Search pages" />
        <div class="filter-tags">
          <button class="filter-btn active" data-level="all">All</button>
          <button class="filter-btn" data-level="1">Elementary</button>
          <button class="filter-btn" data-level="2">Independent</button>
          <button class="filter-btn" data-level="3">Proficient</button>
        </div>
      </div>
    </header>

    <main id="main">
      <nav aria-label="exercise directory">
        <ul id="pages" class="link-grid" aria-live="polite">
          <li>Loading exercises…</li>
        </ul>
      </nav>
    </main>

    <footer>
      <div>Decisionmaker Directory</div>
      <div>Showing <span id="count">0</span> exercises</div>
    </footer>
  </div>

  <script>
    (function () {
      const input = document.getElementById('filter');
      const list = document.getElementById('pages');
      const count = document.getElementById('count');
      const filterBtns = document.querySelectorAll('.filter-btn');
      const repoOwner = 'Balmain-English';
      const repoName = 'decisionmaker-general';
      const branchName = 'main';
      const repoApi = `https://api.github.com/repos/${repoOwner}/${repoName}`;

      let items = [];
      let currentLevel = 'all';

      const levelLabels = {
        1: 'Elementary',
        2: 'Independent',
        3: 'Proficient'
      };

      function rewriteBadgesInDOM() {
        document.querySelectorAll('.tag').forEach(tagEl => {
          const txt = tagEl.textContent.trim();
          const num = txt.replace(/[^0-9]/g, '');
          if (num && levelLabels[num]) {
            tagEl.textContent = levelLabels[num];
          }
        });
      }

      function updateCount() {
        const visible = items.filter(li => li.style.display !== 'none').length;
        count.textContent = visible;
      }

      function applyFilters() {
        const query = input.value.trim().toLowerCase();

        items.forEach(li => {
          const text = li.textContent.toLowerCase();
          const tag = li.querySelector('.tag');

          if (tag) {
            const txt = tag.textContent.trim();
            const num = txt.replace(/[^0-9]/g, '');
            if (num && levelLabels[num]) {
              tag.textContent = levelLabels[num];
            }
          }

          const level = tag ? tag.getAttribute('data-level') || '' : '';
          const matchesQuery = query === '' || text.includes(query);
          const matchesLevel = currentLevel === 'all' || level === currentLevel;

          li.style.display = (matchesQuery && matchesLevel) ? '' : 'none';
        });

        updateCount();
      }

      function debounce(fn, wait) {
        let timeoutId = null;
        return function (...args) {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => fn.apply(this, args), wait);
        };
      }

      filterBtns.forEach(btn => {
        btn.addEventListener('click', (event) => {
          filterBtns.forEach(b => b.classList.remove('active'));
          event.target.classList.add('active');
          currentLevel = event.target.getAttribute('data-level');
          applyFilters();
        });
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === '/' && document.activeElement.tagName !== 'INPUT') {
          event.preventDefault();
          input.focus();
        }
      });

      input.addEventListener('input', debounce(applyFilters, 150));

      function buildTitleFromPath(filePath) {
        const fileName = filePath.split('/').pop().replace(/\.html?$/i, '');
        const withoutLevelSuffix = fileName.replace(/-(\d)(?:[a-z])?$/i, '');
        return withoutLevelSuffix
          .replace(/[-_]+/g, ' ')
          .split(' ')
          .filter(Boolean)
          .map(word => word.charAt(0).toUpperCase() + word.slice(1))
          .join(' ');
      }

      function getLevelFromPath(filePath) {
        const fileName = filePath.split('/').pop().replace(/\.html?$/i, '');
        const match = fileName.match(/-(\d)(?:[a-z])?$/i);
        if (!match) return null;
        return match[1];
      }

      function escapeHtml(str) {
        return String(str).replace(/[&"'<>]/g, function (char) {
          return ({ '&': '&amp;', '"': '&quot;', "'": '&#39;', '<': '&lt;', '>': '&gt;' })[char];
        });
      }

      async function loadExercisePages() {
        try {
          const response = await fetch(`${repoApi}/git/trees/${branchName}?recursive=1&t=${Date.now()}`);
          if (!response.ok) {
            throw new Error(`Failed to load repo tree: ${response.status}`);
          }

          const data = await response.json();
          const htmlFiles = (data.tree || [])
            .filter(item => item.type === 'blob' && /\.html?$/i.test(item.path))
            .filter(item => item.path.toLowerCase() !== 'index.html')
            .sort((a, b) => buildTitleFromPath(a.path).localeCompare(buildTitleFromPath(b.path), undefined, { sensitivity: 'base' }));

          list.innerHTML = '';

          htmlFiles.forEach(file => {
            const filePath = file.path;
            const levelNumber = getLevelFromPath(filePath);
            const levelName = levelNumber ? levelLabels[levelNumber] : null;
            const tagClass = levelNumber ? `tag-${levelNumber}` : 'tag-none';
            const tagText = levelName || '—';
            const title = buildTitleFromPath(filePath);
            const href = `./${encodeURI(filePath)}`;

            const li = document.createElement('li');
            const a = document.createElement('a');
            a.className = 'exercise-btn';
            a.href = href;
            a.setAttribute('role', 'link');
            a.innerHTML = `
              <div class="btn-header">
                <span class="title">${escapeHtml(title)}</span>
                <span class="tag ${tagClass}" data-level="${levelNumber || 'none'}">${escapeHtml(tagText)}</span>
              </div>
              <div class="btn-footer">Open &rarr;</div>
            `;

            li.appendChild(a);
            list.appendChild(li);
          });

          items = Array.from(list.querySelectorAll('li'));
          applyFilters();
        } catch (error) {
          console.error('Failed to load repository files', error);
          list.innerHTML = '<li>No exercises available right now.</li>';
          items = Array.from(list.querySelectorAll('li'));
          rewriteBadgesInDOM();
          applyFilters();
        }
      }

      loadExercisePages();
    })();
  </script>
</body>
</html>
